name: Helm CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build chart dependencies
        run: helm dependency build charts/asynchrone-space

      # The subchart archives are committed so Git-based chart sources
      # (Rancher, Fleet) and packaged charts work without `helm dependency
      # build`. Compare contents with the sources instead of raw bytes: Helm
      # embeds checkout mtimes in the tar headers and re-serializes Chart.yaml,
      # so a rebuild never produces identical files. Metadata is compared
      # through `helm show chart`, which normalizes it.
      - name: Check vendored subcharts are up to date
        shell: bash
        run: |
          set -euo pipefail
          for chart in asynchrone-space-web asynchrone-space-control-tower; do
            set -- charts/asynchrone-space/charts/"${chart}"-*.tgz
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "Expected exactly one vendored archive for ${chart}" >&2
              exit 1
            fi
            archive="$1"
            tmp="$(mktemp -d)"
            tar -xzf "$archive" -C "$tmp"
            diff <(helm show chart "charts/${chart}") <(helm show chart "$archive")
            diff -r --exclude=.helmignore --exclude=Chart.yaml \
              "charts/${chart}" "${tmp}/${chart}"
            rm -rf "$tmp"
          done

      - name: Lint
        run: helm lint --strict charts/asynchrone-space --set global.imageTag=ci-placeholder-tag

      - name: Render
        run: |
          helm template asynchrone-space charts/asynchrone-space \
            --namespace asynchrone-space \
            --set global.imageTag=ci-placeholder-tag \
            > /dev/null
