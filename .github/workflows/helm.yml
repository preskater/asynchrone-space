name: Helm CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build chart dependencies
        run: helm dependency build charts/asynchrone-space

      - name: Lint
        run: helm lint --strict charts/asynchrone-space --set global.imageTag=ci-placeholder-tag

      - name: Render
        run: |
          helm template asynchrone-space charts/asynchrone-space \
            --namespace asynchrone-space \
            --set global.imageTag=ci-placeholder-tag \
            > /dev/null
