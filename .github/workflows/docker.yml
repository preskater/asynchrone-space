name: Docker CI

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            suffix: ""
            target: runner
            cacheScope: web
          - app: control-tower
            suffix: "-control-tower"
            target: runner
            cacheScope: control-tower
          - app: projects
            suffix: "-projects"
            target: runner
            cacheScope: projects
          - app: calendars
            suffix: "-calendars"
            target: runner
            cacheScope: calendars
          - app: files
            suffix: "-files"
            target: runner
            cacheScope: files
          - app: messages
            suffix: "-messages"
            target: runner
            cacheScope: messages
          - app: crm
            suffix: "-crm"
            target: runner
            cacheScope: crm
          - app: hr
            suffix: "-hr"
            target: runner
            cacheScope: hr
          - app: portal
            suffix: "-portal"
            target: runner
            cacheScope: portal
          - app: copilot
            suffix: "-copilot"
            target: runner
            cacheScope: copilot
          # One-shot Prisma migration image (Dockerfile `migrate` stage). The
          # pruned `web` workspace already contains packages/db, which holds
          # the shared schema and migrations.
          - app: web
            suffix: "-migrate"
            target: migrate
            cacheScope: migrate

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          target: ${{ matrix.target }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP=${{ matrix.app }}
          cache-from: type=gha,scope=${{ matrix.cacheScope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cacheScope }}
          # Uncomment to enable Turborepo remote caching
          # build-args: |
          #   TURBO_TEAM=${{ vars.TURBO_TEAM }}
          #   TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
