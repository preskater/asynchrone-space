name: Documentation
description: Update or add documentation for Presk
title: "[Docs] "
labels: ["documentation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for user docs, internal runbooks, API docs, onboarding, etc.

  - type: input
    id: summary
    attributes:
      label: Documentation goal
      description: What docs are missing or need updating?
      placeholder: e.g., Document bulk actions feature for end users
    validations:
      required: true

  - type: textarea
    id: audience
    attributes:
      label: Target audience
      description: Who is this documentation for?
      placeholder: e.g., End users, admins, developers.
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: Content outline
      description: Sections or topics to cover.
      placeholder: |
        - Overview
        - How to select tasks
        - How to apply a bulk action
        - Limits & permissions
        - Troubleshooting
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Where should this live?
      description: Docs site, README, wiki, Notion, etc.
      placeholder: e.g., /docs/user-guide/projects/bulk-actions.md

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links to related features, issues, or designs.