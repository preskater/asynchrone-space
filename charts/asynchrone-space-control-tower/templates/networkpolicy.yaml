{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "asynchrone-space-control-tower.fullname" . }}
  labels:
    {{- include "asynchrone-space-control-tower.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "asynchrone-space-control-tower.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
  egress:
    - to:
        {{- toYaml .Values.networkPolicy.databaseFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.databasePort }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Copilot's identity admin API and OAuth/JWKS endpoints.
    - ports:
        - protocol: TCP
          port: 443
{{- end }}
