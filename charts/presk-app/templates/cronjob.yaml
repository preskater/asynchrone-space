{{- $jobs := list (dict "name" "uploads-sweep" "config" .Values.cronjobs.uploadsSweep) (dict "name" "repository-sync" "config" .Values.cronjobs.repositorySync) -}}
{{- $secretName := .Values.cronjobs.secretName | default .Values.secret.existingSecret -}}
{{- range $job := $jobs }}
{{- if $job.config.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "presk-app.fullname" $ }}-{{ $job.name }}
  labels:
    {{- include "presk-app.labels" $ | nindent 4 }}
spec:
  schedule: {{ $job.config.schedule | quote }}
  concurrencyPolicy: {{ $.Values.cronjobs.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ $.Values.cronjobs.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $.Values.cronjobs.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ $.Values.cronjobs.backoffLimit }}
      activeDeadlineSeconds: {{ $.Values.cronjobs.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ $.Values.cronjobs.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            {{- include "presk-app.selectorLabels" $ | nindent 12 }}
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          {{- with (include "presk-app.imagePullSecrets" $) }}
          imagePullSecrets:
            {{- . | nindent 12 }}
          {{- end }}
          containers:
            - name: curl
              image: {{ $.Values.cronjobs.image }}
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  curl -fsS --retry 2 --retry-connrefused --max-time {{ $.Values.cronjobs.timeoutSeconds }} \
                    -H "Authorization: Bearer ${CRON_SECRET}" "${TARGET_URL}"
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "presk-app.cronjobs.secretName (or secret.existingSecret) is required" $secretName }}
                      key: CRON_SECRET
                - name: TARGET_URL
                  value: "http://{{ include "presk-app.fullname" $ }}:{{ $.Values.service.port }}{{ $job.config.path }}"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 100
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
{{- end }}
