      # Attachment chunks are posted to the app; keep the same 8 MB ceiling as
      # Copilot so a chunk of the files upload client always fits.
      nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    hosts:
      - host: messages.copilot.asynchrone.space
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: asynchrone-space-domain-tls
        hosts:
          - messages.copilot.asynchrone.space

  config:
    MESSAGES_APP_URL: https://messages.copilot.asynchrone.space
    COPILOT_APP_URL: https://copilot.asynchrone.space
    DATABASE_POOL_MAX: "4"
    TRUSTED_IP_HEADERS: "x-real-ip,x-forwarded-for"
    DEPLOY_ENV: production

  secret:
    enabled: true
    existingSecret: asynchrone-space-messages-secrets

