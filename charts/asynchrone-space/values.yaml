    DATABASE_POOL_MAX: "6"
    TRUSTED_IP_HEADERS: "x-real-ip,x-forwarded-for"
    DEPLOY_ENV: production

  secret:
    enabled: true
    existingSecret: asynchrone-space-files-secrets

  # Owned by files since #161; schedule and CRON_SECRET unchanged.
  cronjobs:
    enabled: true
    jobs:
      uploads-sweep:
        enabled: true
        schedule: "0 3 * * *"
        path: /api/files/uploads/sweep

