# ---------------------------------------------------------------------------
# Domain app: files. Own image, host-only OIDC session and uploads-sweep.
# ---------------------------------------------------------------------------
files:
  enabled: true

  nameOverride: files
  image:
    repository: ghcr.io/preskater/asynchrone-space-files
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2
  autoscaling:
