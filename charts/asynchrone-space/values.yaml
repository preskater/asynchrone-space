# ---------------------------------------------------------------------------
# Internal control tower
# ---------------------------------------------------------------------------
control-tower:
  enabled: true

  # Release `asynchrone-space` yields the resources
  # `asynchrone-space-control-tower-*`.
  nameOverride: control-tower
  image:
    repository: ghcr.io/preskater/asynchrone-space-control-tower
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2
  autoscaling:
    enabled: false
    maxReplicas: 2

  ingress:
    enabled: true
    className: nginx
    annotations: {}
      # Restrict at the edge as defense in depth. The app also enforces
      # PLATFORM_ALLOWED_IPS against X-Forwarded-For / X-Real-IP.
      # nginx.ingress.kubernetes.io/whitelist-source-range: "203.0.113.0/24"
    hosts:
      - host: control-tower.asynchrone.space
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: asynchrone-space-tls
        hosts:
          - control-tower.asynchrone.space

  config:
    BETTER_AUTH_URL: https://control-tower.asynchrone.space
    PLATFORM_APP_URL: https://copilot.asynchrone.space
    PLATFORM_ALLOWED_IPS: ""
    DATABASE_POOL_MAX: "3"
    DEPLOY_ENV: production

  secret:
    enabled: true
    existingSecret: asynchrone-space-control-tower-secrets

# ---------------------------------------------------------------------------
# One-shot Prisma migrations, run as a pre-install/pre-upgrade hook before the
# Deployments roll out.
# ---------------------------------------------------------------------------
migrate:
  enabled: true
  # The referenced secret must contain DATABASE_URL (the migration/split
  # tooling) and IDENTITY_DATABASE_URL, PROJECTS_DATABASE_URL, CALENDARS_DATABASE_URL,
  # FILES_DATABASE_URL, MESSAGES_DATABASE_URL, CLIENTS_DATABASE_URL,
  # EMPLOYEES_DATABASE_URL and CONTROL_TOWER_DATABASE_URL. It defaults to the
  # Copilot Secret.
  image:
    repository: ghcr.io/preskater/asynchrone-space-migrate
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # Defaults to copilot.secret.existingSecret when empty.
  existingSecret: ""
  secretKey: DATABASE_URL
  backoffLimit: 2
  activeDeadlineSeconds: 600
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  # The migrate image is a plain Prisma CLI image. It only needs its HOME
  # directory writable; if a future Prisma release writes elsewhere, override
  # readOnlyRootFilesystem or runAsUser here.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources: {}
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
