# Production values for the Asynchrone Space umbrella chart.
#
# Secrets are never stored here. Create one Secret per app before installing:
#
#   asynchrone-space-copilot-secrets:           DATABASE_URL, IDENTITY_DATABASE_URL,
#                                           PROJECTS_DATABASE_URL, CALENDARS_DATABASE_URL,
#                                           FILES_DATABASE_URL, MESSAGES_DATABASE_URL,
#                                           CLIENTS_DATABASE_URL, EMPLOYEES_DATABASE_URL,
#                                           CONTROL_TOWER_DATABASE_URL (for the migrate Job),
#                                           BETTER_AUTH_SECRET, CRON_SECRET, optional
#                                           OPENAI_API_KEY, RESEND_API_KEY,
#                                           GITHUB_CLIENT_SECRET, GITLAB_CLIENT_SECRET
#   asynchrone-space-projects-secrets:      PROJECTS_DATABASE_URL (its own database),
#                                           PROJECTS_OAUTH_CLIENT_ID,
#                                           PROJECTS_OAUTH_CLIENT_SECRET, CRON_SECRET
#                                           (the projects app owns repository-sync)
#   asynchrone-space-calendars-secrets:     CALENDARS_DATABASE_URL (its own database),
#                                           CALENDARS_OAUTH_CLIENT_ID,
#                                           CALENDARS_OAUTH_CLIENT_SECRET
#   asynchrone-space-files-secrets:         FILES_DATABASE_URL (its own database),
#                                           CRON_SECRET, FILES_OAUTH_CLIENT_ID,
#                                           FILES_OAUTH_CLIENT_SECRET
#   asynchrone-space-messages-secrets:      MESSAGES_DATABASE_URL (its own database),
#                                           MESSAGES_OAUTH_CLIENT_ID,
#                                           MESSAGES_OAUTH_CLIENT_SECRET
#   asynchrone-space-clients-secrets:       CLIENTS_DATABASE_URL (its own database),
#                                           CLIENTS_OAUTH_CLIENT_ID,
#                                           CLIENTS_OAUTH_CLIENT_SECRET
#   asynchrone-space-employees-secrets:     EMPLOYEES_DATABASE_URL (its own database),
#                                           EMPLOYEES_OAUTH_CLIENT_ID,
#                                           EMPLOYEES_OAUTH_CLIENT_SECRET
#   asynchrone-space-control-tower-secrets: CONTROL_TOWER_DATABASE_URL,
#                                           CONTROL_TOWER_BETTER_AUTH_SECRET
#
# The landing is stateless and mounts no Secret.
#
# Install with an immutable image tag shared by all images:
#   helm dependency build charts/asynchrone-space
#   helm upgrade --install asynchrone-space charts/asynchrone-space -n asynchrone-space --create-namespace \
#     --set global.imageTag=sha-abc1234

global:
  # Required. Use the immutable tag produced by the Docker workflow for a
  # commit (for example `sha-abc1234`) rather than a branch name.
  imageTag: ""
  imagePullSecrets: []

# ---------------------------------------------------------------------------
# Fleet database-connection budget (ADR 0038, issue #170)
#
# Every app opens `replicas x DATABASE_POOL_MAX` connections. The template
# `templates/validate-connections.yaml` fails the release when an app exceeds
# its own ceiling or the fleet exceeds the limit, so a values edit cannot
# silently exhaust the shared PostgreSQL role. The same numbers live in
# `packages/db-core/src/budget.ts` (runtime clamp) and are cross-checked by
# `npm run verify:connection-budget`.
# ---------------------------------------------------------------------------
connectionBudget:
  enabled: true
  # Assumed PostgreSQL `max_connections`. Raise it together with the budget.
  maxConnections: 200
  # Superuser, monitoring and ad-hoc sessions kept outside the app budget.
  reservedConnections: 10
  # Plan for this percentage of the usable connections.
  ratioPercent: 70
  # Hard ceiling for one app's DATABASE_POOL_MAX (see db-core budget.ts).
  appPoolMax:
    copilot: 8
    projects: 4
    calendars: 4
    files: 6
    messages: 4
    clients: 4
    employees: 4
    control-tower: 3
    migrate: 5

# ---------------------------------------------------------------------------
# Fleet monitoring (issue #170)
#
# The app chart annotates every pod for scraping; this block renders the
# PrometheusRule with the 5xx, pool-saturation and cron-failure alerts. Leave
# `enabled: false` when another PrometheusRule owns the fleet.
# ---------------------------------------------------------------------------
monitoring:
  enabled: true
  # Extra labels for the PrometheusRule so an operator's rule selector finds it.
  ruleLabels: {}
  # Optional runbook link added to every alert annotation.
  runbookUrl: ""

# Two cert-manager certificates cover the whole fleet. `ASYNCHRONE_WILDCARD_TLS`
# covers the apex and every `*.asynchrone.space` host (landing, Copilot and the
# control tower); `ASYNCHRONE_DOMAIN_TLS` covers every
# `*.copilot.asynchrone.space` domain app. Each ingress references the matching
# Secret below. Set `certificates.enabled: false` when you provision the TLS
# Secrets yourself; the ingress TLS entries still render.
certificates:
  enabled: true
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  entries:
    - name: asynchrone-space-tls
      secretName: asynchrone-space-tls
      dnsNames:
        - asynchrone.space
        - "*.asynchrone.space"
    - name: asynchrone-space-domain-tls
      secretName: asynchrone-space-domain-tls
      dnsNames:
        - "*.copilot.asynchrone.space"

# ---------------------------------------------------------------------------
# Public marketing site (no database, no session, no CronJobs)
# ---------------------------------------------------------------------------
landing:
  enabled: true

  # Release `asynchrone-space` yields the resources `asynchrone-space-landing-*`.
  nameOverride: landing
  image:
    repository: ghcr.io/preskater/asynchrone-space-landing
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2

  ingress:
    enabled: true
    className: nginx
    annotations:
      # www.asynchrone.space -> asynchrone.space at the edge.
      nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    hosts:
      - host: asynchrone.space
        paths:
          - path: /
            pathType: Prefix
      - host: www.asynchrone.space
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: asynchrone-space-tls
        hosts:
          - asynchrone.space
          - www.asynchrone.space

  # The landing has no runtime configuration and no Secret. Its browser Sentry
  # is enabled by the build-time SENTRY_DSN arg; server-side Sentry stays off.
  config: {}
  secret:
    enabled: false
  networkPolicy:
    enabled: false
    database: false

  # The landing has no database: a successful page render is the whole check.
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Customer-facing app: workspace shell, identity and OAuth 2.1/OIDC server
# ---------------------------------------------------------------------------
copilot:
  enabled: true

  # Release `asynchrone-space` yields the resources `asynchrone-space-copilot-*`.
  nameOverride: copilot
  image:
    repository: ghcr.io/preskater/asynchrone-space-copilot
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2
  autoscaling:
    enabled: false
    maxReplicas: 4

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "8m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    hosts:
      - host: copilot.asynchrone.space
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: asynchrone-space-tls
        hosts:
          - copilot.asynchrone.space

  config:
    # Issuer and public origin. The GitHub OAuth callback is
    # https://copilot.asynchrone.space/api/auth/callback/github and the GitLab
    # callback is .../callback/gitlab.
    BETTER_AUTH_URL: https://copilot.asynchrone.space
    NEXT_PUBLIC_APP_URL: https://copilot.asynchrone.space
    COPILOT_APP_URL: https://copilot.asynchrone.space
    PLATFORM_APP_URL: https://copilot.asynchrone.space
    PROJECTS_APP_URL: https://projects.copilot.asynchrone.space
    CALENDARS_APP_URL: https://calendars.copilot.asynchrone.space
    FILES_APP_URL: https://files.copilot.asynchrone.space
    MESSAGES_APP_URL: https://messages.copilot.asynchrone.space
    CLIENTS_APP_URL: https://clients.copilot.asynchrone.space
    EMPLOYEES_APP_URL: https://employees.copilot.asynchrone.space
    CONTROL_TOWER_URL: https://control-tower.asynchrone.space
    LANDING_APP_URL: https://asynchrone.space
    # Hosted status page; /api/status redirects there (falls back to /support).
    STATUS_PAGE_URL: ""
    # Keep replicas x DATABASE_POOL_MAX below the database connection limit.
    DATABASE_POOL_MAX: "8"
    # MCP protected-resource identifier. It is also the OAuth resource for the
    # MCP client; never point it at an app host.
    MCP_RESOURCE_URL: https://copilot.asynchrone.space/mcp
    OPENAI_API_URL: ""
    ASSISTANT_MODEL: gpt-4o-mini
    EMAIL_FROM: ""
    REQUIRE_EMAIL_VERIFICATION: "false"
    GITHUB_CLIENT_ID: ""
    GITLAB_CLIENT_ID: ""
    # Pair with TURNSTILE_SECRET_KEY in asynchrone-space-copilot-secrets.
    TURNSTILE_SITE_KEY: ""
    SIGNUP_INVITE_ONLY: "false"
    SIGNUP_BLOCKED_EMAIL_DOMAINS: ""
    # Headers a proxy overwrites; never expose the pods without the ingress.
    TRUSTED_IP_HEADERS: "x-real-ip,x-forwarded-for"
    # Pair with STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET in the Secret.
    STRIPE_PRICE_TEAM_MONTHLY: ""
    STRIPE_PRICE_TEAM_YEARLY: ""
    STRIPE_AUTOMATIC_TAX: ""
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""

  secret:
    enabled: true
    existingSecret: asynchrone-space-copilot-secrets

  # Identity jobs owned by Copilot. Repository sync now belongs to projects;
  # uploads-sweep belongs to files.
  cronjobs:
    enabled: true
    image: curlimages/curl:8.16.0
    secretName: ""
    jobs:
      trial-expiry:
        enabled: true
        schedule: "0 6 * * *"
        path: /api/cron/trial-expiry
      organization-deletion:
        enabled: true
        schedule: "30 3 * * *"
        path: /api/cron/organization-deletion
      audit-retention:
        enabled: true
        schedule: "45 3 * * *"
        path: /api/cron/audit-retention
      data-exports:
        enabled: true
        schedule: "*/15 * * * *"
        path: /api/cron/data-exports

# ---------------------------------------------------------------------------
# Domain app: projects. Own image, host-only OIDC session, repository sync.
# ---------------------------------------------------------------------------
projects:
  enabled: true

  # Release `asynchrone-space` yields the resources `asynchrone-space-projects-*`.
  nameOverride: projects
  image:
    repository: ghcr.io/preskater/asynchrone-space-projects
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2
  autoscaling:
    enabled: false
    maxReplicas: 3

  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: projects.copilot.asynchrone.space
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: asynchrone-space-domain-tls
        hosts:
          - projects.copilot.asynchrone.space

  config:
    PROJECTS_APP_URL: https://projects.copilot.asynchrone.space
    COPILOT_APP_URL: https://copilot.asynchrone.space
    DATABASE_POOL_MAX: "4"
    TRUSTED_IP_HEADERS: "x-real-ip,x-forwarded-for"
    DEPLOY_ENV: production

  secret:
    enabled: true
    existingSecret: asynchrone-space-projects-secrets

  # Moved from Copilot in #168: the hourly safety net for missed repository
  # webhooks now calls the projects Service with the same schedule and
  # CRON_SECRET.
  cronjobs:
    enabled: true
    jobs:
      repository-sync:
        enabled: true
        schedule: "0 * * * *"
        path: /api/cron/repository-sync

# ---------------------------------------------------------------------------
# Domain app: messages. Own image, host-only OIDC session.
# ---------------------------------------------------------------------------
messages:
  enabled: true

  nameOverride: messages
  image:
    repository: ghcr.io/preskater/asynchrone-space-messages
