{{- if .Values.certificates.enabled }}
{{- range .Values.certificates.entries }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
  labels:
    {{- include "asynchrone-space.labels" $ | nindent 4 }}
spec:
  secretName: {{ .secretName }}
  issuerRef:
    {{- toYaml $.Values.certificates.issuerRef | nindent 4 }}
  dnsNames:
    {{- range .dnsNames }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
{{- end }}
