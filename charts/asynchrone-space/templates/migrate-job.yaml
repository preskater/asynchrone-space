{{- if .Values.migrate.enabled }}
{{- $secretName := include "asynchrone-space.migrate.secretName" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "asynchrone-space.fullname" . }}-migrate
  labels:
    {{- include "asynchrone-space.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "asynchrone-space.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "asynchrone-space.migrate.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with (include "asynchrone-space.imagePullSecrets" .) }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrate.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          {{- with .Values.migrate.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "asynchrone-space.migrate.image" . }}
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          env:
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "asynchrone-space.migrate.existingSecret (or asynchrone-space-web.secret.existingSecret) is required" $secretName }}
                  key: {{ .Values.migrate.secretKey }}
            {{- range $key := list "IDENTITY_DATABASE_URL" "PROJECTS_DATABASE_URL" "CALENDARS_DATABASE_URL" "FILES_DATABASE_URL" "MESSAGES_DATABASE_URL" "CLIENTS_DATABASE_URL" "EMPLOYEES_DATABASE_URL" "CONTROL_TOWER_DATABASE_URL" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $key }}
            {{- end }}
            {{- with .Values.migrate.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.migrate.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.migrate.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrate.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrate.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
