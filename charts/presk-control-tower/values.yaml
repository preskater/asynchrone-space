# Default values for the Presk control tower.
#
# The umbrella chart (charts/presk) overrides these values for a full
# production release. Every value here is safe to override with `--set` or a
# values file.

# Propagated by the umbrella chart. `global.imageTag` lets one tag pin every
# Presk image in the release.
global:
  imageTag: ""
  imagePullSecrets: []

replicaCount: 2

image:
  repository: ghcr.io/preskater/presk-control-tower
  # Falls back to global.imageTag. One of the two must be set.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

containerPort: 3000

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: true
  className: nginx
  annotations: {}
    # Restrict the control tower to known networks at the edge too. The app
    # also enforces PLATFORM_ALLOWED_IPS against X-Forwarded-For / X-Real-IP.
    # nginx.ingress.kubernetes.io/whitelist-source-range: "203.0.113.0/24"
  hosts:
    - host: control-tower.presk.re
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: control-tower-presk-tls
    #   hosts:
    #     - control-tower.presk.re

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

terminationGracePeriodSeconds: 30

# Non-secret runtime configuration. Rendered into a ConfigMap and consumed
# with envFrom. Empty values are omitted so the app's own defaults apply.
config:
  BETTER_AUTH_URL: http://localhost:3001
  PLATFORM_APP_URL: http://localhost:3000
  PLATFORM_ALLOWED_IPS: ""
  DATABASE_POOL_MAX: "10"
  DEPLOY_ENV: development

# Existing Secret containing DATABASE_URL and
# CONTROL_TOWER_BETTER_AUTH_SECRET. The chart never creates or stores secrets.
secret:
  existingSecret: presk-control-tower-secrets

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

# The Next.js server writes its incremental/image cache here at runtime. Keep
# it on an emptyDir because the container root filesystem is read-only.
cache:
  mountPath: /usr/src/presk/apps/control-tower/.next/cache

nodeSelector: {}
tolerations: []
affinity: {}

tests:
  image: busybox:1.37.0
