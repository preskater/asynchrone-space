networks:
  postgres-network:

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: preskater
      POSTGRES_PASSWORD: preskater
      POSTGRES_DB: preskater
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "preskater"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      - DATABASE_URL=postgresql://preskater:preskater@postgres:5432/preskater?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres-network
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://preskater:preskater@postgres:5432/preskater?schema=public
      - BETTER_AUTH_SECRET=dev-secret-change-me-in-production
      - BETTER_AUTH_URL=http://localhost:3002
    depends_on:
      postgres:
        condition: service_healthy
      web-migrate:
        condition: service_completed_successfully
    networks:
      - postgres-network
