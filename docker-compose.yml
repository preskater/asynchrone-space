networks:
  postgres-network:

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: preskater
      POSTGRES_PASSWORD: preskater
      POSTGRES_DB: preskater
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "preskater"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      - DATABASE_URL=postgresql://preskater:preskater@postgres:5432/preskater?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres-network
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    # Load the app's .env so local `next dev` and this container share the same
    # BETTER_AUTH_SECRET: the JWKS signing keys stored in the database are
    # encrypted with it, and a different secret breaks MCP/OAuth token
    # issuance ("Failed to decrypt private key"). The `environment` block
    # below still overrides the container-specific values.
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://preskater:preskater@postgres:5432/preskater?schema=public
      - BETTER_AUTH_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      web-migrate:
        condition: service_completed_successfully
    networks:
      - postgres-network
