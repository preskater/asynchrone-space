# Dev-only defaults. Override POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
# from the shell or a repo-root .env (not apps/web/.env). Values are inlined
# into DATABASE_URL, so avoid URL-reserved characters (@ : / ?) in them.
networks:
  postgres-network:

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asynchrone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asynchrone}
      POSTGRES_DB: ${POSTGRES_DB:-asynchrone}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-app-databases.sql:ro
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-asynchrone}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/${POSTGRES_DB:-asynchrone}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres-network
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    # Load the app's .env so local `next dev` and this container share the same
    # BETTER_AUTH_SECRET: the JWKS signing keys stored in the database are
    # encrypted with it, and a different secret breaks MCP/OAuth token
    # issuance ("Failed to decrypt private key"). The `environment` block
    # below still overrides the container-specific values.
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/${POSTGRES_DB:-asynchrone}?schema=public
      - BETTER_AUTH_URL=http://localhost:3002
      - CONTROL_TOWER_URL=http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      web-migrate:
        condition: service_completed_successfully
    networks:
      - postgres-network

  control-tower:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: control-tower
    ports:
      - "3001:3000"
    # Same as `web`: reuse the control tower's own env file (secret, local
    # origins), then override the container-specific values below.
    env_file:
      - path: apps/control-tower/.env
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/${POSTGRES_DB:-asynchrone}?schema=public
      - BETTER_AUTH_URL=http://localhost:3001
      - PLATFORM_APP_URL=http://localhost:3002
    depends_on:
      postgres:
        condition: service_healthy
      web-migrate:
        condition: service_completed_successfully
    networks:
      - postgres-network
